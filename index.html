function showTaskModal(obraId, tid){
  const o = state.obras[obraId];
  const t = tid ? o.tasks[tid] : null;
  const etapas = Array.from(new Set(Object.values(o.tasks).map(x => x.etapa).filter(Boolean)));
  const byWeek = viewMode === 'resumida';
  const initWeek = t ? mondayOfISO(t.start) : nextMondayISO();
  const initWeeks = t ? weeksSpan(t) : 1;
  openModal(`<h3>${t ? 'Editar atividade' : 'Nova atividade'}</h3>
    <div class="field"><label for="tk-text">Atividade</label><input type="text" id="tk-text" value="${esc(t ? t.text : '')}" list="tk-names" placeholder="Ex: Executar infra elétrica" />
      <datalist id="tk-names">${allActivityNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="field"><label for="tk-etapa">Etapa (opcional)</label><input type="text" id="tk-etapa" value="${esc(t ? t.etapa : '')}" list="tk-etapas" placeholder="Ex: Instalações" />
      <datalist id="tk-etapas">${etapas.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    ${byWeek ? `<div class="grid2">
      <div class="field"><label for="tk-week">Semana de início</label><input type="date" id="tk-week" value="${initWeek}" /><div class="hint">Qualquer dia serve: vale a semana inteira.</div></div>
      <div class="field"><label for="tk-weeks">Duração (semanas)</label><input type="number" id="tk-weeks" min="1" step="1" value="${initWeeks}" /></div>
    </div><div class="hint muted small" style="margin:-4px 0 6px;">Para datas exatas, use a visão Completa (dias), no topo da página.</div>`
    : `<div class="grid2">
      <div class="field"><label for="tk-start">Início</label><input type="date" id="tk-start" value="${t ? t.start : nextMondayISO()}" /></div>
      <div class="field"><label for="tk-end">Término</label><input type="date" id="tk-end" value="${t ? t.end : addDaysISO(nextMondayISO(), 4)}" /></div>
    </div>`}
    <div class="modal-error" id="tk-err"></div>
    <div class="modal-actions"><button class="btn" id="tk-cancel">Cancelar</button><button class="btn primary" id="tk-ok">Salvar</button></div>`);
  $('tk-cancel').onclick = closeModal;
  $('tk-ok').onclick = async () => {
    const text = $('tk-text').value.trim(), etapa = $('tk-etapa').value.trim();
    if (!text) return showError('tk-err', 'Digite o nome da atividade.');
    let start, end;
    if (byWeek){
      const wkIn = $('tk-week').value, n = Math.round(Number($('tk-weeks').value));
      if (!isISO(wkIn)) return showError('tk-err', 'Escolha a semana de início.');
      if (!(n >= 1 && n <= 104)) return showError('tk-err', 'Duração em semanas: de 1 a 104.');
      if (t && mondayOfISO(wkIn) === initWeek && n === initWeeks){ start = t.start; end = t.end; }   // sem mudança: mantém os dias exatos
      else { start = mondayOfISO(wkIn); end = addDaysISO(start, 7 * n - 2); }                        // segunda a sábado
    } else {
      start = $('tk-start').value; end = $('tk-end').value || start;
      if (!isISO(start)) return showError('tk-err', 'Escolha a data de início.');
      if (end < start) return showError('tk-err', 'O término não pode ser antes do início.');
    }
    if (t) Object.assign(t, { text, etapa, start, end });
    else addTask(o, { text, etapa, start, end });
    closeModal(); await save(); render();
  };
}

function showImportPreview(obraId, sheets, fileName){
  const usable = sheets.filter(s => s.result.items.length);
  if (!usable.length){
    openModal(`<h3>Não encontrei atividades nessa planilha</h3>
      <p class="muted">A importação procura colunas de <b>atividade</b>, <b>início</b> e <b>término</b> (ou duração). Confira se a planilha tem essas colunas com datas, ou envie o arquivo para ajustar a leitura ao modelo da empresa.</p>
      <div class="modal-actions"><button class="btn primary" id="ip-close">Fechar</button></div>`);
    $('ip-close').onclick = closeModal;
    return;
  }
  usable.sort((a, b) => b.result.items.length - a.result.items.length);
  showItemsPreview(obraId, usable, fileName);
}

function showItemsPreview(obraId, sheets, sourceName){
  const o = state.obras[obraId];
  let current = 0;
  const hasTasks = Object.keys(o.tasks).length > 0;
  let mode = hasTasks ? 'replace' : 'add';
  const draw = () => {
    const res = sheets[current].result;
    const hasEtapa = res.items.some(i => i.etapa);
    openModal(`<h3>Importar cronograma — ${esc(sourceName)}</h3>
      ${sheets.length > 1 ? `<div class="field"><label for="ip-sheet">Aba da planilha</label><select id="ip-sheet">${sheets.map((s, i) => `<option value="${i}"${i === current ? ' selected' : ''}>${esc(s.name)} (${s.result.items.length} atividades)</option>`).join('')}</select></div>` : ''}
      <p class="muted small" style="margin-top:0;">${res.items.length} atividades encontradas${res.skipped ? ` · ${res.skipped} linhas ignoradas (sem atividade ou sem data)` : ''}. Desmarque o que não for atividade (ex.: linhas de resumo).</p>
      <div class="preview-box"><table class="tbl"><thead><tr><th><input type="checkbox" id="ip-all" checked /></th>${hasEtapa ? '<th>Etapa</th>' : ''}<th>Atividade</th><th>Início</th><th>Término</th></tr></thead>
      <tbody>${res.items.map((it, i) => `<tr><td><input type="checkbox" data-i="${i}" checked /></td>${hasEtapa ? `<td class="muted">${esc(it.etapa)}</td>` : ''}<td>${esc(it.text)}</td><td class="nowrap">${fmtDMY(it.start)}</td><td class="nowrap">${fmtDMY(it.end)}</td></tr>`).join('')}</tbody></table></div>
      ${hasTasks ? `<div class="field" style="margin-top:12px;"><label>Esta obra já tem ${Object.keys(o.tasks).length} atividades</label>
        <div class="seg"><button type="button" id="ip-replace" class="${mode === 'replace' ? 'active' : ''}">Substituir o cronograma</button><button type="button" id="ip-add" class="${mode === 'add' ? 'active' : ''}">Acrescentar ao atual</button></div></div>` : ''}
      <div class="modal-error" id="ip-err"></div>
      <div class="modal-actions"><button class="btn" id="ip-cancel">Cancelar</button><button class="btn primary" id="ip-ok">Importar</button></div>`, true);
    if ($('ip-sheet')) $('ip-sheet').onchange = e => { current = Number(e.target.value); draw(); };
    $('ip-all').onchange = e => document.querySelectorAll('#modal [data-i]').forEach(cb => cb.checked = e.target.checked);
    if ($('ip-replace')){
      $('ip-replace').onclick = () => { mode = 'replace'; $('ip-replace').classList.add('active'); $('ip-add').classList.remove('active'); };
      $('ip-add').onclick = () => { mode = 'add'; $('ip-add').classList.add('active'); $('ip-replace').classList.remove('active'); };
    }
    $('ip-cancel').onclick = closeModal;
    $('ip-ok').onclick = async () => {
      const chosen = Array.from(document.querySelectorAll('#modal [data-i]')).filter(cb => cb.checked).map(cb => res.items[Number(cb.dataset.i)]);
      if (!chosen.length) return showError('ip-err', 'Marque pelo menos uma atividade.');
      if (mode === 'replace' && hasTasks){
        if (!confirm('Substituir todas as atividades atuais desta obra pelas importadas?')) return;
        o.tasks = {};
      }
      let order = nextOrder(o);
      chosen.forEach(it => addTask(o, Object.assign({}, it, { order: order++ })));
      closeModal();
      if (await save()) toast(`${chosen.length} atividades importadas.`);
      view.tab = 'calendario';
      render();
    };
  };
  draw();
}

function showShiftModal(obraId){
  const o = state.obras[obraId];
  const list = sortedTasks(o);
  const byWeek = viewMode === 'resumida';
  openModal(`<h3>Deslocar datas</h3>
    <p class="muted small" style="margin-top:0;">Move várias atividades de uma vez (atraso geral da obra, por exemplo). Para uma atividade só, clique no nome dela e use "Adiar" ou "Atrasada".</p>
    <div class="grid2">
      <div class="field"><label for="sh-from">Atividades que começam a partir de</label><input type="date" id="sh-from" value="${list[0].start}" /></div>
      <div class="field"><label for="sh-n">Deslocar quantas ${byWeek ? 'semanas' : 'dias'}</label><input type="number" id="sh-n" value="1" step="1" />
        <div class="hint">Negativo antecipa.</div></div>
    </div>
    <div class="modal-error" id="sh-err"></div>
    <div class="modal-actions"><button class="btn" id="sh-cancel">Cancelar</button><button class="btn primary" id="sh-ok">Deslocar</button></div>`);
  $('sh-cancel').onclick = closeModal;
  $('sh-ok').onclick = async () => {
    const from = $('sh-from').value, n = Math.round(Number($('sh-n').value));
    if (!isISO(from)) return showError('sh-err', 'Escolha a data.');
    if (!n) return showError('sh-err', 'Digite um número diferente de zero.');
    const days = byWeek ? n * 7 : n;
    let count = 0;
    Object.values(o.tasks).forEach(t => { if (t.start >= from){ t.start = addDaysISO(t.start, days); t.end = addDaysISO(t.end, days); count++; } });
    closeModal();
    if (await save()) toast(`${count} atividades deslocadas.`);
    render();
  };
}

/* ===================================================================
 * Configurações
 * =================================================================== */
function renderSettings(c){
  c.insertAdjacentHTML('beforeend', `<div class="page-head"><div><h2>Configurações</h2></div></div>
    <div class="card">
      <div class="field" style="max-width:420px;"><label for="st-company">Nome da empresa (aparece na imagem e no texto)</label>
        <input type="text" id="st-company" value="${esc(state.settings.company)}" placeholder="Ex: Conceito Engenharia" /></div>
      <button class="btn primary" id="st-save">Salvar</button>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px;font-size:15px;">Cópia de segurança</h3>
      <p class="muted small" style="margin:0 0 10px;">${backend === 'firebase' ? 'Os dados ficam na nuvem (Firebase) e abrem em qualquer aparelho.' : 'Sem conexão com a nuvem: os dados estão só neste navegador. Baixe uma cópia de vez em quando.'}</p>
      <div class="row"><button class="btn" id="st-export">⬇ Baixar backup (.json)</button><button class="btn" id="st-import">⬆ Restaurar backup</button></div>
      <p class="muted small" style="margin:10px 0 0;">${backend === 'firebase' ? 'Além disso, a nuvem guarda sozinha uma cópia por dia e outra antes de cada restauração ou versão nova.' : ''}</p>
      <p class="muted small" style="margin:10px 0 0;">Versão ${APP_VERSION}</p>
    </div>`);
  $('st-save').onclick = async () => { state.settings.company = $('st-company').value.trim(); if (await save()) toast('Configurações salvas.'); render(); };
  $('st-export').onclick = exportBackup;
  $('st-import').onclick = pickBackupFile;
}

/* ---------- backup manual (.json) ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup_planejamento_${todayISO()}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup baixado.');
}
function pickBackupFile(){
  let input = document.getElementById('backup-file-input');
  if (!input){
    input = document.createElement('input');
    input.type = 'file'; input.accept = '.json,application/json'; input.id = 'backup-file-input'; input.hidden = true;
    input.onchange = async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (f) await restoreBackupFile(f);
    };
    document.body.appendChild(input);
  }
  input.click();
}
async function restoreBackupFile(f){
  try{
    const raw = JSON.parse(await f.text());
    if (!raw || typeof raw !== 'object' || (!raw.obras && !raw.catalog)) throw new Error('não é um backup do Planejamento de Obras');
    const data = normalizeState(raw);
    const n = Object.keys(data.obras).length;
    const when = raw.lastUpdated ? ' (salvo em ' + new Date(raw.lastUpdated).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ')' : '';
    if (!confirm(`Restaurar o backup com ${n} obra${n === 1 ? '' : 's'}${when}?\n\nOs dados atuais serão substituídos (antes disso, uma cópia deles é guardada na nuvem).`)) return;
    await fbBackupOnce('antes_de_restaurar_' + Date.now());
    state = data;
    if (await save()){ view.section = 'geral'; render(); toast('Backup restaurado.'); }
  }catch(err){ toast('Não foi possível restaurar: ' + (err.message || err), true); }
}

/* ===================================================================
 * Início
 * =================================================================== */
async function init(){
  let raw = {};
  try{ raw = await loadRaw(); state = normalizeState(raw); }
  catch(e){ console.error(e); state = normalizeState({}); }
  render();
  // cópia de segurança na nuvem: uma por dia e uma na primeira abertura de cada versão nova
  const day = todayISO();
  fbBackupOnce('dia_' + day).then(() => {
    if (raw && raw.appVersion && raw.appVersion !== APP_VERSION) fbBackupOnce('antes_da_versao_' + APP_VERSION);
  });
}
// ao voltar para a aba: recarrega da nuvem (pode ter sido editado em outro aparelho)
let lastDay = todayISO();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !state || modalOpen()) return;
  if (todayISO() !== lastDay){ lastDay = todayISO(); view.target = defaultTargetMonday(); }
  if (backend === 'firebase'){ try{ state = normalizeState(await loadRaw()); }catch(e){} }
  if (!modalOpen()) render();
});
init();
</script>
